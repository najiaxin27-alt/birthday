<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🎂 生日快乐 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fff0f5 0%, #fce4ec 40%, #f8d7e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Helvetica Neue", system-ui, -apple-system, sans-serif;
            padding: 12px;
            touch-action: pan-y;
            overflow: hidden;
        }

        .card {
            width: 100%;
            max-width: 520px;
            min-height: 94vh;
            background: rgba(255, 248, 250, 0.60);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 56px 56px 40px 40px;
            padding: 18px 14px 24px;
            box-shadow: 0 24px 48px -12px rgba(200, 140, 160, 0.30),
                        0 0 0 1px rgba(240, 180, 200, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.45);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* ===== 全屏烟花 Canvas ===== */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: block;
        }

        /* ===== 蛋糕区域 ===== */
        .cake-section {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 8px auto 0;
            height: 300px;
            position: relative;
            width: 100%;
            z-index: 2;
            flex-shrink: 0;
        }

        .cake-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* ===== 蜡烛 - 带跳动火苗 ===== */
        .candle-wrapper {
            position: relative;
            z-index: 6;
            margin-bottom: -6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candle {
            width: 20px;
            height: 52px;
            background: radial-gradient(ellipse at 30% 20%, #fce4ec, #f0c0d0);
            border-radius: 12px 12px 4px 4px;
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.06),
                        0 8px 20px rgba(200, 150, 170, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            position: relative;
            transform: translateY(6px);
        }
        .candle::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 24px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
        }
        .candle::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 4px;
            right: 4px;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1px;
            box-shadow: 0 8px 0 rgba(255, 255, 255, 0.10),
                        0 16px 0 rgba(255, 255, 255, 0.08);
        }

        /* 🔥 火苗 - 跳动动画 */
        .flame {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 28px;
            background: radial-gradient(ellipse at 50% 80%, #ffe8b0 0%, #ffd58a 40%, #ffaa55 70%, rgba(255, 100, 50, 0.3) 100%);
            border-radius: 60% 60% 40% 40%;
            filter: blur(0.5px);
            box-shadow: 0 0 30px 10px rgba(255, 200, 100, 0.35),
                        0 0 60px 25px rgba(255, 180, 80, 0.15);
            animation: flameDance 0.8s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }
        .flame::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 14px;
            background: radial-gradient(ellipse at 50% 80%, #fff8e0 0%, #ffdd99 50%, rgba(255, 200, 100, 0.2) 100%);
            border-radius: 50% 50% 30% 30%;
            filter: blur(0.3px);
            animation: innerFlame 0.6s infinite alternate ease-in-out;
        }
        .flame-glow {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle,
                        rgba(255, 215, 150, 0.20) 0%,
                        rgba(255, 200, 140, 0.06) 35%,
                        transparent 72%);
            border-radius: 50%;
            pointer-events: none;
            animation: glowPulse 2.0s infinite alternate;
        }

        @keyframes flameDance {
            0% { transform: translateX(-50%) scale(1) rotate(-4deg) skewX(2deg); height: 28px; width: 16px; }
            30% { transform: translateX(-55%) scale(1.08, 0.92) rotate(3deg) skewX(-1deg); height: 32px; width: 18px; }
            60% { transform: translateX(-45%) scale(0.95, 1.05) rotate(-2deg) skewX(1deg); height: 26px; width: 20px; }
            100% { transform: translateX(-50%) scale(1.05, 0.90) rotate(4deg) skewX(-2deg); height: 30px; width: 17px; }
        }
        @keyframes innerFlame {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); height: 12px; width: 6px; }
            100% { transform: translateX(-50%) scale(1.15, 0.85) rotate(3deg); height: 16px; width: 7px; }
        }
        @keyframes glowPulse {
            0% { opacity: 0.2; transform: translateX(-50%) scale(0.7); }
            100% { opacity: 0.9; transform: translateX(-50%) scale(1.5); }
        }

        /* ===== 蛋糕体 ===== */
        .cake-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -10px;
            z-index: 5;
            position: relative;
        }

        .layer {
            width: 100%;
            border-radius: 60px 60px 16px 16px;
            margin-top: -6px;
            position: relative;
            transition: transform 0.2s;
        }

        .layer-bottom {
            height: 64px;
            background: linear-gradient(180deg, #f5d0d8, #ecc0ca);
            border-radius: 60px 60px 24px 24px;
            box-shadow: 0 10px 0 #dbb5c0, 0 16px 32px rgba(200, 140, 160, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.30);
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(255,255,255,0.18) 0%, transparent 55%),
                radial-gradient(circle at 85% 70%, rgba(255,255,255,0.12) 0%, transparent 45%),
                repeating-linear-gradient(90deg, transparent 0px, transparent 18px, rgba(255,255,255,0.06) 18px, rgba(255,255,255,0.06) 20px);
            overflow: hidden;
        }
        .layer-bottom::before {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 8%;
            width: 84%;
            height: 12px;
            background: repeating-conic-gradient(rgba(255,255,255,0.08) 0% 25%, transparent 0% 50%) 0 0 / 12px 12px;
            border-radius: 50%;
            opacity: 0.5;
        }
        .layer-bottom::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 12%;
            width: 76%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(2px);
        }

        .layer-middle {
            height: 42px;
            background: linear-gradient(180deg, #fad0dc, #f0c0ce);
            border-radius: 50px 50px 12px 12px;
            box-shadow: 0 8px 0 #dbb5c2, 0 10px 24px rgba(200, 140, 160, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.30);
            background-image: 
                radial-gradient(circle at 25% 35%, rgba(255,255,255,0.18) 0%, transparent 50%),
                radial-gradient(circle at 75% 65%, rgba(255,255,255,0.10) 0%, transparent 40%),
                repeating-linear-gradient(45deg, transparent 0px, transparent 14px, rgba(255,255,255,0.05) 14px, rgba(255,255,255,0.05) 16px);
        }

        .layer-top {
            height: 36px;
            background: linear-gradient(180deg, #fce0e8, #f5ccd8);
            border-radius: 40px 40px 10px 10px;
            box-shadow: 0 6px 0 #ddc0ca, 0 8px 20px rgba(200, 140, 160, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.35);
            background-image: 
                radial-gradient(circle at 35% 25%, rgba(255,255,255,0.22) 0%, transparent 55%),
                radial-gradient(circle at 65% 75%, rgba(255,255,255,0.08) 0%, transparent 40%);
        }

        .cream {
            display: flex;
            justify-content: space-around;
            width: 86%;
            margin-top: -18px;
            margin-bottom: 2px;
            z-index: 7;
            position: relative;
        }
        .cream-dot {
            width: 26px;
            height: 26px;
            background: radial-gradient(circle at 35% 25%, #fffaff, #fce8f0);
            border-radius: 50%;
            box-shadow: inset -3px -4px 0 #f0d8e0,
                        0 6px 16px rgba(200, 150, 170, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);
            position: relative;
        }
        .cream-dot::after {
            content: '♥';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            color: rgba(200, 140, 160, 0.20);
            opacity: 0.5;
        }

        .cake-pearls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.0rem;
            letter-spacing: 12px;
            color: rgba(200, 160, 180, 0.30);
            z-index: 8;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(200, 120, 140, 0.08);
        }
        .cake-pearls span {
            display: inline-block;
            animation: pearlShine 2.0s infinite alternate;
        }
        @keyframes pearlShine {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1.1); }
        }

        .cake-hearts {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.6rem;
            letter-spacing: 20px;
            color: rgba(220, 160, 180, 0.15);
            z-index: 4;
            pointer-events: none;
        }

        /* ===== 文字区域 ===== */
        .text-content {
            margin: -30px auto 0;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 8;
            width: 94%;
            padding: 0 6px;
            pointer-events: none;
            flex-shrink: 0;
        }

        .greeting-wrapper {
            background: rgba(255, 248, 250, 0.60);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 80px 80px 40px 40px;
            padding: 28px 24px 22px;
            border: 1px solid rgba(255, 255, 255, 0.40);
            box-shadow: 0 16px 48px rgba(200, 140, 160, 0.08);
            transition: all 0.4s ease;
            pointer-events: auto;
        }

        .greeting {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1.5;
            color: #5a3a4a;
            text-shadow: 0 2px 16px rgba(200, 130, 150, 0.06);
            word-break: break-word;
            letter-spacing: 0.5px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            min-height: 5.2rem;
        }

        .greeting .highlight {
            display: inline-block;
            background: linear-gradient(135deg, #d4728a, #e894a8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .greeting.fade-out {
            opacity: 0;
            transform: scale(0.92) translateY(8px);
        }
        .greeting.fade-in {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .sub-text {
            margin-top: 10px;
            font-size: 1.5rem;
            font-weight: 500;
            color: #a07a8a;
            opacity: 0.80;
            letter-spacing: 1.5px;
            transition: opacity 0.5s ease 0.12s, transform 0.5s ease 0.12s;
            min-height: 2.6rem;
        }
        .sub-text.fade-out {
            opacity: 0;
            transform: translateY(6px);
        }
        .sub-text.fade-in {
            opacity: 0.8;
            transform: translateY(0);
        }

        .tap-hint {
            margin-top: 14px;
            font-size: 0.95rem;
            color: #c09aa8;
            opacity: 0.4;
            letter-spacing: 3px;
            border-top: 1px dashed rgba(200, 150, 170, 0.15);
            padding-top: 16px;
            transition: opacity 0.4s;
            pointer-events: auto;
        }

        .stars-deco {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.4rem;
            opacity: 0.15;
            letter-spacing: 10px;
            color: #c09aa8;
            z-index: 5;
            pointer-events: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .card { max-width: 98%; padding: 12px 10px 16px; min-height: 90vh; border-radius: 36px; }
            .cake-section { height: 240px; }
            .cake-container { width: 220px; height: 220px; }
            .layer-bottom { height: 48px; }
            .layer-middle { height: 32px; }
            .layer-top { height: 28px; }
            .cream-dot { width: 20px; height: 20px; }
            .cream-dot::after { font-size: 6px; }
            .candle { width: 16px; height: 40px; }
            .flame { width: 14px; height: 22px; top: -18px; }
            .flame::before { width: 6px; height: 10px; }
            .flame-glow { width: 100px; height: 100px; top: -30px; }
            .greeting-wrapper { padding: 20px 16px 16px; border-radius: 60px; }
            .greeting { font-size: 2.0rem; min-height: 4.0rem; }
            .sub-text { font-size: 1.2rem; }
            .text-content { margin: -20px auto 0; min-height: 150px; }
            .cake-pearls { font-size: 0.8rem; letter-spacing: 8px; bottom: 8px; }
        }

        @media (max-width: 380px) {
            .card { min-height: 88vh; padding: 8px 8px 12px; }
            .cake-section { height: 190px; }
            .cake-container { width: 170px; height: 170px; }
            .layer-bottom { height: 36px; }
            .layer-middle { height: 24px; }
            .layer-top { height: 20px; }
            .cream-dot { width: 14px; height: 14px; }
            .cream-dot::after { font-size: 4px; }
            .candle { width: 12px; height: 30px; }
            .flame { width: 10px; height: 16px; top: -14px; }
            .flame::before { width: 4px; height: 8px; }
            .flame-glow { width: 70px; height: 70px; top: -24px; }
            .greeting { font-size: 1.5rem; min-height: 3.2rem; }
            .sub-text { font-size: 1.0rem; }
            .greeting-wrapper { padding: 14px 12px 12px; border-radius: 40px; }
            .text-content { margin: -10px auto 0; min-height: 120px; }
            .tap-hint { font-size: 0.7rem; margin-top: 8px; padding-top: 10px; }
            .cake-pearls { font-size: 0.6rem; letter-spacing: 4px; bottom: 4px; }
            .cake-hearts { font-size: 1.0rem; letter-spacing: 12px; bottom: 10px; }
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    
/* Birthday letter: lightweight mobile layout */
body { overflow-x:hidden; overflow-y:auto; padding:24px 16px; background:#fff9f3; color:#583746; }
.card { min-height:0; max-width:480px; padding:32px 22px 26px; border-radius:160px 160px 28px 28px; background:linear-gradient(180deg,#fce7e8,#fff8f0 75%); backdrop-filter:none; -webkit-backdrop-filter:none; border:1px solid #ebcdd0; box-shadow:0 16px 48px #9b697318; }
.card::before {content:'';position:absolute;inset:10px;border:1px solid #ffffffb0;border-radius:150px 150px 20px 20px;pointer-events:none;}
.kicker {margin-top:18px;font:11px Georgia,serif;letter-spacing:4px;color:#997280;text-align:center;}
.intro {font-size:13px;letter-spacing:2px;color:#9b7780;margin-top:14px;text-align:center;}
.cake-section {height:244px;margin:0 auto 20px;}
.cake-container {width:230px;height:230px;}
.text-content {margin:0 auto;width:100%;min-height:0;padding:0;}
.greeting-wrapper {padding:16px 8px 20px;background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0;}
.greeting {font-family:Georgia,'Songti SC','SimSun',serif;font-size:32px;line-height:1.5;min-height:96px;letter-spacing:2px;color:#793f52;}
.sub-text {font-size:14px;line-height:1.9;letter-spacing:1px;min-height:54px;color:#926e77;opacity:1;}
.tap-hint {font-size:11px;letter-spacing:2px;opacity:.75;margin-top:0;padding-top:14px;}
.wish-button {position:relative;z-index:10;border:0;border-radius:99px;padding:14px 26px;margin:22px 0 8px;background:#874b60;color:#fff9f3;font:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 18px #874b6020;touch-action:manipulation;}
.wish-button:focus-visible {outline:3px solid #c58198;outline-offset:4px;}
.letter-footer {font-size:11px;letter-spacing:2px;color:#a38488;position:relative;margin-top:20px;}
.stars-deco {top:110px;right:34px;opacity:.4;}
.flame,.flame-glow {transition:opacity .35s;}
.card.blown .flame,.card.blown .flame-glow {opacity:0;animation:none;}
@media(max-width:500px){body{padding:16px 12px;} .card{max-width:440px;min-height:0;padding:24px 18px;border-radius:140px 140px 24px 24px;} .cake-section{height:210px;margin-bottom:10px;} .cake-container{width:210px;height:210px;} .greeting{font-size:29px;min-height:87px;} .sub-text{font-size:13px;} .text-content{margin:0;min-height:0;} .greeting-wrapper{padding:12px 4px;} .tap-hint{font-size:10px;} .flame-glow{display:none;} }
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;} #fireworks-canvas{display:none;}}

</style>

<body>
<!-- 全屏烟花 Canvas -->
<canvas id="fireworks-canvas"></canvas>

<div class="card" id="card">
    <div class="kicker">A LITTLE WISH FOR YOU</div>
    <div class="intro">这一天，世界多了一个可爱的你</div>
    <div class="stars-deco">✦ ✧ ✦</div>

    <!-- 蛋糕区域 -->
    <div class="cake-section">
        <div class="cake-container">
            <div class="candle-wrapper">
                <div class="candle" id="candle">
                    <div class="flame" id="flame"></div>
                    <div class="flame-glow" id="flameGlow"></div>
                </div>
            </div>
            <div class="cake-body">
                <div class="cream">
                    <span class="cream-dot"></span>
                    <span class="cream-dot"></span>
                    <span class="cream-dot"></span>
                    <span class="cream-dot"></span>
                    <span class="cream-dot"></span>
                    <span class="cream-dot"></span>
                </div>
                <div class="layer layer-top"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-bottom"></div>
                <div class="cake-hearts">♡ ✿ ♡</div>
                <div class="cake-pearls">
                    <span>✦</span>
                    <span>✦</span>
                    <span>✦</span>
                    <span>✦</span>
                    <span>✦</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 文字区域 -->
    <div class="text-content" id="textContent">
        <div class="greeting-wrapper">
            <div class="greeting fade-in" id="greetingText">生日快乐<br>愿你闪闪发光</div>
            <div class="sub-text fade-in" id="subText">把所有温柔的祝福，<br>都送给今天的你。</div>
        </div>
        <div class="tap-hint">轻触卡片 · 翻开下一句祝福</div>
    </div>
<button class="wish-button" id="wishButton" type="button">许个愿 · 吹灭蜡烛</button>
<div class="letter-footer">愿每一岁，都有新的欢喜 ♡</div>
</div>

<script>
    (function() {
        // ========== 文字切换 - 渐出渐入 ==========
        const greetingEl = document.getElementById('greetingText');
        const subEl = document.getElementById('subText');
        const card = document.getElementById('card');

        const messages = [
            {main:'生日快乐<br>愿你闪闪发光',sub:'把所有温柔的祝福，都送给今天的你。'},
            {main:'有幸相识<br>很高兴遇见你',sub:'平凡的日子，因为有你，多了一点可爱。'},
            {main:'愿你心有热爱<br>眼里一直有光',sub:'慢慢走也没关系，你有自己的花期。'},
            {main:'愿你平安喜乐<br>也被温柔以待',sub:'有人懂你的欲言又止，也有人陪你开怀大笑。'},
            {main:'新的一岁<br>尽情成为自己',sub:'愿你自由、勇敢，拥有许多值得期待的明天。'}
        ];

        let step = 0;
        let isAnimating = false;

        function updateText(index) {
            const msg = messages[index];
            if (!msg) return;

            greetingEl.classList.remove('fade-in');
            greetingEl.classList.add('fade-out');
            subEl.classList.remove('fade-in');
            subEl.classList.add('fade-out');

            setTimeout(() => {
                greetingEl.innerHTML = msg.main;
                subEl.textContent = msg.sub;
                greetingEl.classList.remove('fade-out');
                greetingEl.classList.add('fade-in');
                subEl.classList.remove('fade-out');
                subEl.classList.add('fade-in');
                isAnimating = false;
            }, 400);
        }

        function handleTap(e) {
            if (isAnimating) return;
            isAnimating = true;
            triggerFireworkAtTap(e);
            step = (step + 1) % messages.length;
            updateText(step);
        }

        function triggerFireworkAtTap(e) {
            if (document.hidden) return;
            createExplosion(e.clientX, e.clientY);
        }

        card.addEventListener('click', handleTap);
        card.addEventListener('touchstart', function(e) {}, { passive: true });

        greetingEl.classList.add('fade-in');
        subEl.classList.add('fade-in');

        // 烟花使用 CSS 像素坐标，限制粒子和帧率，避免手机高分屏过度绘制。
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        const mobile = window.matchMedia('(pointer: coarse), (max-width: 600px)').matches;
        const maxParticles = mobile ? 80 : 160;
        const burstCount = mobile ? 24 : 40;
        const frameTime = 1000 / 30;
        const palette = ['#ff7070', '#ffbb44', '#ffe466', '#50d890', '#68baff', '#ba8cff', '#ff91c8'];
        let width = 0, height = 0;
        let particles = [];
        let animationFrameId = null;
        let lastFrame = 0;
        let lastBurst = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            // 手机以 1 倍分辨率绘制装饰，桌面最多 1.5 倍。
            const scale = mobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
        }

        function createExplosion(x, y) {
            const count = Math.min(burstCount, maxParticles - particles.length);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 40 + Math.random() * 90;
                particles.push({
                    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    age: 0, life: 1 + Math.random() * 0.6,
                    size: 1.5 + Math.random() * 2,
                    color: palette[Math.floor(Math.random() * palette.length)]
                });
            }
        }

        function animate(now) {
            if (document.hidden) { animationFrameId = null; return; }
            animationFrameId = requestAnimationFrame(animate);
            if (now - lastFrame < frameTime) return;
            const dt = Math.min((now - lastFrame) / 1000 || 1 / 30, 0.05);
            lastFrame = now;
            if (now - lastBurst >= (mobile ? 1800 : 1300)) {
                createExplosion(width * (0.15 + Math.random() * 0.7), height * (0.1 + Math.random() * 0.3));
                lastBurst = now;
            }
            ctx.clearRect(0, 0, width, height);
            let alive = 0;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.age += dt;
                if (p.age >= p.life) continue;
                p.vx *= Math.pow(0.98, dt * 60);
                p.vy += 35 * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                ctx.globalAlpha = 1 - p.age / p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                particles[alive++] = p;
            }
            particles.length = alive;
            ctx.globalAlpha = 1;
        }

        function startFireworks() {
            if (animationFrameId !== null || document.hidden || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            resizeCanvas();
            lastFrame = performance.now();
            lastBurst = lastFrame;
            createExplosion(width / 2, height * 0.22);
            animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                particles.length = 0;
                ctx.clearRect(0, 0, width, height);
            } else {
                startFireworks();
            }
        });
        startFireworks();
        const wishButton = document.getElementById('wishButton');
        wishButton.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isAnimating) return;
            const blown = card.classList.toggle('blown');
            wishButton.textContent = blown ? '再点一次 · 重新点亮' : '许个愿 · 吹灭蜡烛';
            if (blown) {
                greetingEl.innerHTML = '愿望已悄悄收好';
                subEl.textContent = '愿你的期待，在新的一岁慢慢实现。';
                createExplosion(width / 2, height * 0.3);
            } else {
                isAnimating = true;
                updateText(step);
            }
        });
        console.log('🎂 浅粉梦境 · 多彩烟花 + 精美蛋糕 + 跳动火苗');
    })();
</script>
</body>
</html>
